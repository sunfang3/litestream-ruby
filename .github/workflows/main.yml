name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "4.0.6"

    steps:
    - uses: actions/checkout@v4
    # ubuntu-latest (24.04) does not ship recent MRI; setup-ruby@v1
    # downloads prebuilt binaries so system apt Ruby is not required.
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        # Bundler 4 multi-platform resolution fails on this lockfile
        # (mini_portile2 / arm64-darwin + x86_64-linux). Pin 2.x.
        bundler: "2.6.9"
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake
