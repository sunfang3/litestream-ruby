name: Ruby Gem

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # ubuntu-latest (24.04) does not ship recent MRI; setup-ruby downloads
    # prebuilt binaries (including 4.0.x) so system apt Ruby is not required.
    # Prefer @v1 over a commit SHA so new Ruby versions stay available.
    - name: Set up Ruby 4.0.6
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0.6"

    - name: Build gem
      run: gem build *.gemspec

    # Only publish on pushes to main (not PRs). Re-pushing an existing
    # version is treated as success so routine commits do not fail CI.
    - name: Publish to GPR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        set +e
        output=$(gem push --KEY github --host "https://rubygems.pkg.github.com/${OWNER}" *.gem 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ "$status" -ne 0 ]; then
          if echo "$output" | grep -qi 'already been pushed'; then
            echo "Gem version already published; treating as success."
            exit 0
          fi
          exit "$status"
        fi
      env:
        GEM_HOST_API_KEY: "Bearer ${{secrets.GITHUB_TOKEN}}"
        OWNER: ${{ github.repository_owner }}
